# Stable releases publish only from permanent vX.Y.Z tags.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Recovery path for an immutable tag whose publication workflow failed.
  # The job still checks out and validates the existing remote semver tag;
  # this never creates, moves, or deletes a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: stable-release-publication
  cancel-in-progress: false

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged revision and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Fetch main ancestry without changing tags
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The project quality gate runs the backend pytest suite through uv.
      # Pin the same runner used by local verification so stable publication
      # executes the complete gate instead of failing on a missing tool.
      - name: Install Python test runner
        run: python -m pip install "uv==0.11.28"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Resolve stable release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release: invalid stable tag: $tag" >&2
            exit 1
          }
          version="${tag#v}"
          candidate_sha="$(git rev-parse HEAD)"
          python3 scripts/changelog.py extract "$version" > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/changelog.py title "$version" > "$RUNNER_TEMP/release-title.txt"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Enforce stable prepublication conditions
        shell: bash
        run: |
          set -euo pipefail
          scripts/check_release_preconditions.sh \
            --tag "${{ steps.release.outputs.tag }}" \
            --sha "${{ steps.release.outputs.sha }}" \
            --archive Decky-SteamAchievements.zip \
            --remote origin \
            --main-ref origin/main \
            --quality-gate scripts/orchestration-hooks/quality-gates

      # The quality gate intentionally builds a hash-free ZIP. Generate the
      # final ZIP, checksum, and manifest only after every mutating gate so the
      # three published assets cannot drift apart.
      - name: Build stable release assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package.mjs \
            --release \
            --release-version "$RELEASE_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --channel stable \
            --emit-release-metadata
          sha256sum -c "Decky-SteamAchievements-$RELEASE_TAG.zip.sha256"
          python3 scripts/validate_plugin_zip.py \
            Decky-SteamAchievements.zip \
            --expected-root Decky-SteamAchievements \
            --expected-name "Deck UI Restored" \
            --expected-version "$RELEASE_VERSION"
          python3 scripts/check_backend_archive_parity.py \
            Decky-SteamAchievements.zip \
            --project-root .

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          title="$(< "$RUNNER_TEMP/release-title.txt")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              Decky-SteamAchievements.zip \
              "Decky-SteamAchievements-$TAG.zip.sha256" \
              "Decky-SteamAchievements-$TAG.manifest.json" \
              --clobber
            gh release edit "$TAG" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" \
              Decky-SteamAchievements.zip \
              "Decky-SteamAchievements-$TAG.zip.sha256" \
              "Decky-SteamAchievements-$TAG.manifest.json" \
              --verify-tag \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
